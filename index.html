<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Discord</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0f172a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            cursor: none;
        }

        #cursor-follower {
            position: fixed;
            top: 0; left: 0;
            width: 30px; height: 30px;
            background: radial-gradient(circle, rgba(88, 101, 242, 0.6) 0%, rgba(88, 101, 242, 0) 70%);
            border: 1.5px solid rgba(88, 101, 242, 0.4);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        .discord-card {
            background-color: #313338;
            width: 430px;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            color: #dbdee1;
            user-select: none;
        }

        .invite-header {
            color: #b5bac1;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .server-info {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .server-icon {
            width: 50px; height: 50px;
            background: #5865f2;
            border-radius: 15px;
            margin-right: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
            color: white;
            overflow: hidden;
        }

        .server-icon img { width: 100%; height: 100%; object-fit: cover; }

        .server-name {
            color: #f2f3f5;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .status-counts {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #b5bac1;
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            margin-right: 4px;
            background-color: #23a559;
        }

        .join-button {
            background-color: #248046;
            color: white;
            width: 100%;
            border: none;
            padding: 10px;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
            box-sizing: border-box;
        }

        .script-badge {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #3f4147;
            text-align: center;
            font-style: italic;
            color: #949ba4;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div id="cursor-follower"></div>

    <div class="discord-card">
        <div class="invite-header">Live Server Status</div>
        
        <div class="server-info">
            <div id="icon-box" class="server-icon">L</div>
            <div class="server-name-container">
                <div id="guild-name" class="server-name">Lumina</div>
                <div class="status-counts">
                    <span class="status-dot"></span> 
                    <span id="online-count">Fetching live data...</span>
                </div>
            </div>
        </div>

        <a href="https://discord.gg/JGnkxBfNYs" target="_blank" class="join-button">Join Server</a>

        <div class="script-badge">
            #1 Basketball Legends script
        </div>
    </div>

    <script>
        const INVITE_CODE = 'JGnkxBfNYs';

        async function fetchDiscordData() {
            try {
                const response = await fetch(`https://discord.com/api/v10/invites/${INVITE_CODE}?with_counts=true`);
                const data = await response.json();
                
                if (data.guild) {
                    document.getElementById('guild-name').textContent = data.guild.name;
                    document.getElementById('online-count').textContent = `${data.approximate_presence_count.toLocaleString()} Online`;
                    
                    if (data.guild.icon) {
                        const iconUrl = `https://cdn.discordapp.com/icons/${data.guild.id}/${data.guild.icon}.png`;
                        document.getElementById('icon-box').innerHTML = `<img src="${iconUrl}" alt="Icon">`;
                    }
                }
            } catch (err) {
                document.getElementById('online-count').textContent = "Live data unavailable";
            }
        }

        const follower = document.getElementById('cursor-follower');
        let mouseX = 0, mouseY = 0, followerX = 0, followerY = 0;
        window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
        function animate() {
            followerX += (mouseX - followerX) * 0.15;
            followerY += (mouseY - followerY) * 0.15;
            follower.style.left = followerX + 'px';
            follower.style.top = followerY + 'px';
            requestAnimationFrame(animate);
        }

        fetchDiscordData();
        animate();
    </script>
</body>
</html>
