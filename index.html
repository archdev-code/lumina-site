<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Tracker</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #0f172a; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; cursor: none;
        }
        #cursor-follower {
            position: fixed; top: 0; left: 0; width: 30px; height: 30px;
            background: radial-gradient(circle, rgba(88, 101, 242, 0.6) 0%, rgba(88, 101, 242, 0) 70%);
            border: 1.5px solid rgba(88, 101, 242, 0.4); border-radius: 50%;
            pointer-events: none; z-index: 9999; transform: translate(-50%, -50%);
        }
        .card { background-color: #313338; width: 400px; border-radius: 8px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); color: #dbdee1; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #4e5058; padding-bottom: 10px; }
        .tab-btn { background: none; border: none; color: #b5bac1; cursor: pointer; font-weight: bold; font-size: 14px; padding: 5px 10px; outline: none; }
        .tab-btn.active { color: white; border-bottom: 2px solid #5865f2; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .mention { color: #00a8fc; background: rgba(0,168,252,0.1); padding: 0 4px; border-radius: 3px; font-weight: 500; }
        .info-item { margin-bottom: 12px; line-height: 1.5; }
        .server-info { display: flex; align-items: center; margin-bottom: 20px; }
        .server-icon { width: 50px; height: 50px; background: #5865f2; border-radius: 15px; margin-right: 16px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 20px; color: white; overflow: hidden; }
        .server-icon img { width: 100%; height: 100%; object-fit: cover; }
        .join-btn { background-color: #248046; color: white; width: 100%; border: none; padding: 10px; border-radius: 3px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: block; text-align: center; }
        .status-counts { display: flex; align-items: center; font-size: 12px; color: #b5bac1; margin-top: 4px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; background-color: #23a559; }
    </style>
</head>
<body>
    <div id="cursor-follower"></div>
    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'Discord')">Discord</button>
            <button class="tab-btn" onclick="openTab(event, 'Info')">Info</button>
        </div>

        <div id="Discord" class="tab-content active">
            <div class="server-info">
                <div id="icon-box" class="server-icon">L</div>
                <div>
                    <div id="guild-name" style="color: white; font-weight: 700; font-size: 16px;">Lumina</div>
                    <div class="status-counts">
                        <span class="status-dot"></span>
                        <span id="online-count">Fetching...</span>
                    </div>
                </div>
            </div>
            <a href="https://discord.gg/JGnkxBfNYs" target="_blank" class="join-btn">Join Server</a>
            <div style="margin-top: 15px; text-align: center; font-style: italic; color: #949ba4; font-size: 12px;">#1 Basketball Legends script</div>
        </div>

        <div id="Info" class="tab-content">
            <div class="info-item">
                <span style="color: #b5bac1;">Coder of website:</span><br>
                <span class="mention">@Cinder</span> (Find him on Discord)
            </div>
            <div class="info-item">
                <span style="color: #b5bac1;">Helped put up website:</span><br>
                <span class="mention">@Display</span>
            </div>
        </div>
    </div>

    <script>
        function openTab(evt, tabName) {
            var i, content, tabs;
            content = document.getElementsByClassName("tab-content");
            for (i = 0; i < content.length; i++) { content[i].style.display = "none"; }
            tabs = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tabs.length; i++) { tabs[i].className = tabs[i].className.replace(" active", ""); }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }

        const INVITE_CODE = 'JGnkxBfNYs';
        async function fetchDiscordData() {
            try {
                const response = await fetch(`https://discord.com/api/v10/invites/${INVITE_CODE}?with_counts=true`);
                const data = await response.json();
                if (data.guild) {
                    document.getElementById('guild-name').textContent = data.guild.name;
                    document.getElementById('online-count').textContent = `${data.approximate_presence_count.toLocaleString()} Online`;
                    if (data.guild.icon) {
                        const iconUrl = `https://cdn.discordapp.com/icons/${data.guild.id}/${data.guild.icon}.png`;
                        document.getElementById('icon-box').innerHTML = `<img src="${iconUrl}" alt="Icon">`;
                    }
                }
            } catch (err) { document.getElementById('online-count').textContent = "Offline"; }
        }

        const follower = document.getElementById('cursor-follower');
        let mouseX = 0, mouseY = 0, followerX = 0, followerY = 0;
        window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
        function animate() {
            followerX += (mouseX - followerX) * 0.15;
            followerY += (mouseY - followerY) * 0.15;
            follower.style.left = followerX + 'px';
            follower.style.top = followerY + 'px';
            requestAnimationFrame(animate);
        }
        fetchDiscordData();
        animate();
    </script>
</body>
</html>
